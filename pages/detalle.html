<div class="page" data-name="detalle">
    <div class="navbar detalle-navbar">
        <div class="navbar-bg"></div>
        <div class="navbar-inner">
            <div class="left">
                <a href="#" class="link back detalle-nav-boton">
                    <i class="f7-icons">chevron_left</i>
                </a>
            </div>

            <div class="title">Detalle</div>

            <div class="right">
                <a href="#" class="link detalle-nav-boton detalle-favorito">
                    <i class="f7-icons">heart</i>
                </a>
            </div>
        </div>
    </div>

    <div class="page-content detalle-page">
        <div class="detalle-imagen">
            <img id="detalle-imagen" src="" alt="">
        </div>

        <div class="detalle-encabezado-producto">
            <h1 id="detalle-nombre"></h1>
            <strong id="detalle-precio"></strong>
        </div>

        <div class="detalle-rating">
            <span class="detalle-estrella">★</span>
            <span id="detalle-rating"></span>
        </div>

        <p class="detalle-descripcion" id="detalle-descripcion"></p>

        <div class="detalle-opcion" id="detalle-atributo" style="display:none">
            <div class="detalle-opcion-superior">
                <span class="detalle-etiqueta" id="detalle-atributo-etiqueta"></span>
                <span class="detalle-valor" id="detalle-atributo-valor"></span>
            </div>
            <div class="detalle-tono" id="detalle-atributo-muestra" style="display:none"></div>
        </div>

        <div class="detalle-opcion detalle-cantidad-fila">
            <span class="detalle-etiqueta">Cantidad</span>

            <div class="detalle-cantidad-control">
                <button type="button" class="detalle-restar" aria-label="Restar cantidad">−</button>
                <span class="detalle-cantidad-numero">1</span>
                <button type="button" class="detalle-sumar" aria-label="Sumar cantidad">+</button>
            </div>
        </div>

        <a href="#" class="button button-fill detalle-seleccionar">Seleccionar</a>
    </div>
</div>
